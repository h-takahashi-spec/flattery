<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お世辞実験 結果</title>
<!--
  ============================================================
  お世辞実験 結果ダッシュボード
  ------------------------------------------------------------
  ・スプレッドシートのデータを15秒ごとに読みに行き、自動でグラフを更新する
  ・API_URL は flattery.html の GAS_URL と同じURLでよい（doGet を追加する）
  ・URL に ?demo=1 を付けると、ダミーデータで表示確認できる
  ・学籍番号は Apps Script 側で削除してから返すので、画面には出ない

  ---- Apps Script に追加する関数（doPost と同じファイルに貼る）----
  function doGet() {
    const sh = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
    const v = sh.getDataRange().getValues();
    if (v.length < 2) return json([]);
    const head = v.shift();
    const rows = v.map(r => {
      const o = {};
      head.forEach((h, i) => { if (h !== "student_id" && h !== "ua") o[h] = r[i]; });
      return o;
    });
    return json(rows);
  }
  function json(x) {
    return ContentService.createTextOutput(JSON.stringify(x))
      .setMimeType(ContentService.MimeType.JSON);
  }
  ※ 追加後は「デプロイを管理 → 編集 → 新しいバージョン」で更新する
  ============================================================
-->
<style>
  :root{
    color-scheme: light;
    --bg:#f6f4ef; --surface:#fcfcfb; --line:#e3e1da; --grid:#ecebe6;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7973;
    --series-1:#eb6834;  /* お世辞あり（orange） */
    --series-2:#2a78d6;  /* お世辞なし（blue） */
    --accent:#2f6f5e; --warn-bg:#fff4d6; --warn-ink:#6b4a00;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#121211; --surface:#1a1a19; --line:#2f2f2c; --grid:#262624;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
      --series-1:#d95926; --series-2:#3987e5;
      --accent:#6fb59e; --warn-bg:#3a3010; --warn-ink:#ffe7a3;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --line:#2f2f2c; --grid:#262624;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --series-1:#d95926; --series-2:#3987e5;
    --accent:#6fb59e; --warn-bg:#3a3010; --warn-ink:#ffe7a3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text-primary);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px}
  h1{font-size:1.5rem;margin:0}
  .meta{color:var(--text-secondary);font-size:.85rem}
  .banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 12px;font-size:.9rem;margin-bottom:14px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:16px;font-size:.92rem;color:var(--text-secondary)}
  .controls label{cursor:pointer;display:flex;align-items:center;gap:6px}
  .controls input{accent-color:var(--accent);width:16px;height:16px}
  .controls button{font:inherit;font-size:.85rem;cursor:pointer;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--text-primary);padding:5px 12px}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .tile .k{font-size:.82rem;color:var(--text-secondary)}
  .tile .v{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
  .tile .s{font-size:.8rem;color:var(--text-muted);margin-top:2px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}

  .hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 10px;margin-bottom:16px}
  .hero h2,.panel h2{font-size:1.05rem;margin:0 0 4px}
  .hero .sub,.panel .sub{font-size:.85rem;color:var(--text-secondary);margin:0 0 10px}
  .heroRow{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
  @media (max-width:560px){.heroRow{grid-template-columns:1fr 1fr}}
  .heroNum .k{font-size:.9rem;color:var(--text-secondary)}
  .heroNum .v{font-size:3.2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .heroNum .n{font-size:.8rem;color:var(--text-muted)}
  .heroDiff{font-size:.95rem;color:var(--text-secondary);text-align:right;padding-bottom:8px}
  .heroDiff b{font-size:1.4rem;color:var(--text-primary);font-variant-numeric:tabular-nums}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 12px;margin-bottom:16px}
  .legend{display:flex;gap:16px;font-size:.88rem;color:var(--text-secondary);margin:0 0 6px}
  .legend span{display:flex;align-items:center}
  .row{display:grid;grid-template-columns:minmax(150px,240px) 1fr 120px;gap:12px;align-items:center;
    padding:6px 0;border-top:1px solid var(--grid)}
  .row:first-of-type{border-top:none}
  .row .lab{font-size:.92rem}
  .row .stat{font-size:.8rem;color:var(--text-secondary);text-align:right;font-variant-numeric:tabular-nums;line-height:1.35}
  .row .stat b{color:var(--text-primary)}
  @media (max-width:640px){
    .row{grid-template-columns:1fr auto;}
    .row .lab{grid-column:1/2}
    .row .stat{grid-column:2/3;grid-row:1}
    .row .plot{grid-column:1/3}
  }
  .plot svg{display:block;width:100%;overflow:visible}
  .axisrow{display:grid;grid-template-columns:minmax(150px,240px) 1fr 120px;gap:12px}
  @media (max-width:640px){.axisrow{grid-template-columns:1fr} .axisrow .sp{display:none}}
  .note{font-size:.8rem;color:var(--text-muted);margin-top:8px}

  .tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--text-primary);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;font-size:.82rem;box-shadow:0 4px 16px rgba(0,0,0,.15);opacity:0;transition:opacity .1s;z-index:10;
    font-variant-numeric:tabular-nums}
  .tip .t{color:var(--text-secondary);font-size:.78rem}

  table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
  th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--text-secondary);font-weight:600}
  details summary{cursor:pointer;color:var(--text-secondary);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>お世辞実験 結果</h1>
    <div class="meta" id="meta">読み込み中…</div>
  </header>
  <div id="banner"></div>

  <div class="controls">
    <label><input type="checkbox" id="onlyOk">確認問題に正解した人だけ</label>
    <label><input type="checkbox" id="auto" checked>15秒ごとに自動更新</label>
    <button id="reload">今すぐ更新</button>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="hero" id="hero"></div>

  <div class="panel">
    <h2>アンケート項目ごとの平均（1〜7）</h2>
    <p class="sub">点＝平均、線＝95%信頼区間。右端は差（あり − なし）とウェルチのt検定のp値。</p>
    <div class="legend">
      <span><i class="sw" style="background:var(--series-1)"></i>お世辞あり</span>
      <span><i class="sw" style="background:var(--series-2)"></i>お世辞なし</span>
    </div>
    <div id="rows"></div>
    <div class="axisrow"><div class="sp"></div><div class="plot" id="axis"></div><div class="sp"></div></div>
    <p class="note">サンプルが少ないうちは信頼区間が広く、p値も不安定です。人数が集まるまで結論は保留しましょう。</p>
  </div>

  <div class="panel">
    <details>
      <summary>数値の表を見る</summary>
      <div id="table" style="margin-top:10px;overflow-x:auto"></div>
    </details>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
// ===== 設定 =====
const API_URL = "https://script.google.com/macros/s/AKfycbymXGe5QeyAr6tkjIgMlAjPx_gUOAunIbSTKQvM6SB3jNGcgJw3NTppT3akwC5xYjMYWA/exec";   // ← Apps Script のウェブアプリURL（flattery.html の GAS_URL と同じ）
const REFRESH_MS = 15000;

const ITEMS = [
  {k:"enjoy",        t:"ゲームは楽しかった"},
  {k:"self",         t:"自分はうまくやれた"},
  {k:"correct_conf", t:"自分の答えは正解だと思う"},
  {k:"compet",       t:"コンピュータは有能だ"},
  {k:"like",         t:"コンピュータに好感をもった"},
  {k:"again",        t:"コンピュータとまた遊びたい"},
  {k:"based",        t:"コメントは自分の質問にもとづいていた"},
];
const COMPUTER = ["compet","like","again"];   // ヒーロー指標：コンピュータへの評価
const COND = [
  {k:"flattery", t:"お世辞あり", c:"var(--series-1)"},
  {k:"generic",  t:"お世辞なし", c:"var(--series-2)"},
];

const params = new URLSearchParams(location.search);
const DEMO = params.has("demo") || !API_URL;
const $ = id => document.getElementById(id);

// ===== 統計 =====
const mean = a => a.reduce((s,x)=>s+x,0)/a.length;
const sd = a => { if(a.length<2) return NaN; const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); };
function lgamma(x){ const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x, t=x+5.5; t-=(x+.5)*Math.log(t); let s=1.000000000190015; for(const v of c) s+=v/++y; return -t+Math.log(2.5066282746310005*s/x); }
function betacf(a,b,x){ let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap; if(Math.abs(d)<1e-30)d=1e-30; d=1/d; let h=d;
  for(let m=1;m<=200;m++){ const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<1e-30)d=1e-30; c=1+aa/c; if(Math.abs(c)<1e-30)c=1e-30; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<1e-30)d=1e-30; c=1+aa/c; if(Math.abs(c)<1e-30)c=1e-30; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<3e-7)break; } return h; }
function ibeta(x,a,b){ if(x<=0)return 0; if(x>=1)return 1; const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2) ? bt*betacf(a,b,x)/a : 1-bt*betacf(b,a,1-x)/b; }
const tP2 = (t,df) => ibeta(df/(df+t*t), df/2, .5);              // 両側p
function tCrit(df){ let lo=0,hi=50; for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(tP2(m,df)>.05) lo=m; else hi=m; } return (lo+hi)/2; }
function summ(a){ const n=a.length, m=n?mean(a):NaN, s=sd(a), se=s/Math.sqrt(n), h=n>1?tCrit(n-1)*se:NaN; return {n,m,s,lo:m-h,hi:m+h}; }
function welch(a,b){
  if(a.length<2||b.length<2) return {d:NaN,p:NaN,es:NaN};
  const va=sd(a)**2, vb=sd(b)**2, na=a.length, nb=b.length;
  const se=Math.sqrt(va/na+vb/nb); const diff=mean(a)-mean(b);
  if(se===0) return {d:diff,p:diff===0?1:0,es:NaN};
  const t=diff/se, df=(va/na+vb/nb)**2/((va/na)**2/(na-1)+(vb/nb)**2/(nb-1));
  const sp=Math.sqrt(((na-1)*va+(nb-1)*vb)/(na+nb-2));
  return {d:diff, p:tP2(Math.abs(t),df), es: sp>0?diff/sp:NaN};
}
const f1 = x => isFinite(x) ? x.toFixed(1) : "–";
const f2 = x => isFinite(x) ? x.toFixed(2) : "–";
const fp = p => !isFinite(p) ? "–" : p<.001 ? "p < .001" : "p = "+p.toFixed(3).replace(/^0/,"");
const sgn = x => isFinite(x) ? (x>0?"+":x<0?"−":"±")+Math.abs(x).toFixed(2) : "–";

// ===== データ =====
function demoData(){
  let seed=7; const r=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const lik = m => Math.max(1,Math.min(7,Math.round(m+(r()+r()+r()-1.5)*2.2)));
  const out=[];
  for(let i=0;i<58;i++){
    const fl = i%2===0;
    const b = {enjoy:4.6,self:3.9,correct_conf:3.6,compet:4.1,like:4.0,again:4.2,based:3.5};
    const up = {enjoy:.7,self:.9,correct_conf:.4,compet:1.1,like:1.0,again:.8,based:1.4};
    const o={condition:fl?"flattery":"generic", correct: r()<.3?1:0, check_ok: r()<.9?1:0};
    for(const k in b) o[k]=lik(b[k]+(fl?up[k]:0));
    out.push(o);
  }
  return out;
}
async function load(){
  if(DEMO) return demoData();
  const res = await fetch(API_URL + (API_URL.includes("?")?"&":"?") + "t=" + Date.now());
  if(!res.ok) throw new Error("HTTP "+res.status);
  return await res.json();
}

// ===== 描画 =====
const tip = $("tip");
function showTip(e, html){ tip.innerHTML=html; tip.style.opacity=1;
  const x=Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8), y=Math.min(e.clientY+14, innerHeight-tip.offsetHeight-8);
  tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.style.opacity=0; }

function render(rows){
  const onlyOk = $("onlyOk").checked;
  const valid = rows.filter(r => COND.some(c=>c.k===r.condition) && (!onlyOk || +r.check_ok===1));
  const by = {}; COND.forEach(c => by[c.k] = valid.filter(r=>r.condition===c.k));

  // tiles
  const corr = c => { const a=by[c].map(r=>+r.correct); return a.length? Math.round(100*mean(a))+"%" : "–"; };
  const chk = rows.length ? Math.round(100*mean(rows.map(r=>+r.check_ok||0)))+"%" : "–";
  $("tiles").innerHTML = `
    <div class="tile"><div class="k">回答者数</div><div class="v">${valid.length}</div><div class="s">${onlyOk?"確認問題 正解者のみ":"全員"}</div></div>
    ${COND.map(c=>`<div class="tile"><div class="k"><i class="sw" style="background:${c.c}"></i>${c.t}</div><div class="v">${by[c.k].length}<span style="font-size:1rem;font-weight:500"> 人</span></div><div class="s">正解率 ${corr(c.k)}</div></div>`).join("")}
    <div class="tile"><div class="k">確認問題の正答率</div><div class="v">${chk}</div><div class="s">説明を正しく読めていた割合</div></div>`;

  // hero: コンピュータへの評価（3項目平均）
  const comp = c => by[c].map(r => mean(COMPUTER.map(k=>+r[k])));
  const A = comp("flattery"), B = comp("generic"); const w = welch(A,B);
  $("hero").innerHTML = `
    <h2>コンピュータへの評価</h2>
    <p class="sub">「有能だ」「好感をもった」「また遊びたい」の平均（1〜7）</p>
    <div class="heroRow">
      ${[["flattery",A],["generic",B]].map(([k,a])=>{ const c=COND.find(x=>x.k===k); return `
        <div class="heroNum"><div class="k"><i class="sw" style="background:${c.c}"></i>${c.t}</div>
        <div class="v">${a.length?f2(mean(a)):"–"}</div><div class="n">n = ${a.length}</div></div>`;}).join("")}
      <div class="heroDiff">差 <b>${sgn(w.d)}</b><br>${fp(w.p)}${isFinite(w.es)?` ／ d = ${f2(w.es)}`:""}</div>
    </div>`;

  // dot + CI rows
  const box = $("rows"); const W = Math.max(200, (box.clientWidth || 600) - (innerWidth<=640 ? 0 : 384));
  const H = 44, pad = 10, X = v => pad + (v-1)/6*(W-2*pad);
  const tableRows = [];
  box.innerHTML = ITEMS.map((it,i) => {
    const S = COND.map(c => summ(by[c.k].map(r=>+r[it.k]).filter(isFinite)));
    const w = welch(by.flattery.map(r=>+r[it.k]).filter(isFinite), by.generic.map(r=>+r[it.k]).filter(isFinite));
    tableRows.push({it,S,w});
    const grid = [1,2,3,4,5,6,7].map(v=>`<line x1="${X(v)}" x2="${X(v)}" y1="2" y2="${H-2}" stroke="var(--grid)" stroke-width="1"/>`).join("");
    const marks = COND.map((c,j) => { const s=S[j]; if(!s.n) return ""; const y = j===0 ? 15 : 31;
      const ci = isFinite(s.lo) ? `<line x1="${X(Math.max(1,s.lo))}" x2="${X(Math.min(7,s.hi))}" y1="${y}" y2="${y}" stroke="${c.c}" stroke-width="2" stroke-linecap="round"/>` : "";
      return `${ci}<circle cx="${X(s.m)}" cy="${y}" r="6" fill="${c.c}" stroke="var(--surface)" stroke-width="2"/>
        <rect class="hit" data-i="${i}" data-j="${j}" x="${X(1)-6}" y="${y-8}" width="${X(7)-X(1)+12}" height="16" fill="transparent"/>`; }).join("");
    return `<div class="row">
      <div class="lab">${it.t}</div>
      <div class="plot"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${it.t}">${grid}${marks}</svg></div>
      <div class="stat">差 <b>${sgn(w.d)}</b><br>${fp(w.p)}</div>
    </div>`;
  }).join("");
  $("axis").innerHTML = `<svg width="${W}" height="20" viewBox="0 0 ${W} 20">${[1,2,3,4,5,6,7].map(v=>
    `<text x="${X(v)}" y="14" text-anchor="middle" font-size="11" fill="var(--text-muted)">${v}</text>`).join("")}</svg>`;
  box.querySelectorAll(".hit").forEach(el => {
    const {it,S} = tableRows[+el.dataset.i]; const c = COND[+el.dataset.j]; const s = S[+el.dataset.j];
    const html = `<div class="t">${it.t}</div><div><i class="sw" style="background:${c.c}"></i>${c.t}</div>
      <div>平均 <b>${f2(s.m)}</b>（SD ${f2(s.s)}）</div><div>95%CI ${f2(s.lo)}〜${f2(s.hi)}</div><div>n = ${s.n}</div>`;
    el.addEventListener("mousemove", e => showTip(e, html));
    el.addEventListener("mouseleave", hideTip);
  });

  // table
  $("table").innerHTML = `<table><thead><tr><th>項目</th>${COND.map(c=>`<th>${c.t} 平均（SD）</th>`).join("")}<th>差</th><th>p</th><th>d</th></tr></thead><tbody>
    ${tableRows.map(({it,S,w})=>`<tr><td>${it.t}</td>${S.map(s=>`<td>${f2(s.m)}（${f2(s.s)}）</td>`).join("")}<td>${sgn(w.d)}</td><td>${fp(w.p).replace("p ","")}</td><td>${f2(w.es)}</td></tr>`).join("")}
    </tbody></table>`;
}

let DATA = [];
async function refresh(){
  try{
    DATA = await load();
    render(DATA);
    const t = new Date(); $("meta").textContent = `最終更新 ${t.toLocaleTimeString("ja-JP")}　全 ${DATA.length} 件`;
    $("banner").innerHTML = DEMO ? `<div class="banner">デモ表示中（ダミーデータ）。API_URL を設定すると実データに切り替わります。</div>` : "";
  }catch(e){
    $("meta").textContent = "読み込みに失敗しました（" + e.message + "）";
  }
}
let timer = null;
function setAuto(){ clearInterval(timer); if($("auto").checked && !DEMO) timer = setInterval(refresh, REFRESH_MS); }
$("onlyOk").onchange = () => render(DATA);
$("auto").onchange = setAuto;
$("reload").onclick = refresh;
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(()=>render(DATA), 150); });
refresh(); setAuto();
</script>
</body>
</html>
